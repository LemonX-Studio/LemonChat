name: Build PassID APK
on:
  push:
    branches: [ main ]
    paths:
      - 'PassID/**'
      - '.github/workflows/build-passid.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Restore signing key
        run: echo "${{ secrets.LEMON_JKS_B64 }}" | base64 -d > PassID/app/lemonchat.jks

      - name: Build APK
        working-directory: PassID
        run: gradle assembleRelease --no-daemon
        env:
          JKS_PASS: ${{ secrets.JKS_PASS }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PassID-LC-APK
          path: PassID/app/build/outputs/apk/release/app-release.apk
