name: Keep DB Warm
on:
  schedule:
    - cron: '*/5 10-15 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API
        run: |
          curl -s -m 20 "https://lemonchat-three.vercel.app/api/profile?userId=1" > /dev/null
          curl -s -m 20 "https://lemonchat-three.vercel.app/api/conversations?userId=1" > /dev/null
          echo warmed
